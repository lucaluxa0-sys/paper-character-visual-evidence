name: Evidence Artifact
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper_root_collision_ab_stable.mp4'
      - '.github/workflows/evidence-artifact.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: paper-root-collision-ab-stable
          path: paper_root_collision_ab_stable.mp4
          retention-days: 7

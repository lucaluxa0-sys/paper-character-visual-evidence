name: Evidence Artifact
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'live/**'
      - 'paper_root_collision_ab_stable.mp4'
      - '.github/workflows/evidence-artifact.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: paper-live-evidence
          path: |
            live/**/*.jpg
            live/**/*.jpeg
            live/**/*.png
            live/**/*.mp4
            paper_root_collision_ab_stable.mp4
          if-no-files-found: error
          retention-days: 1

name: Evidence Artifact
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper_ab_no_visualprojector.mp4'
      - '.github/workflows/evidence-artifact.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: paper-ab-no-visualprojector
          path: paper_ab_no_visualprojector.mp4
          retention-days: 7
